---
- name: Check swap status
  ansible.builtin.command: /usr/sbin/swapon --show --noheadings
  register: swap_status
  changed_when: false

- name: Disable swap
  ansible.builtin.command: /usr/sbin/swapoff -a
  when: swap_status.stdout | length > 0

- name: Comment out swap entries in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?![ \t]*#)([ \t]*\S+[ \t]+\S+[ \t]+swap[ \t]+[^\r\n]*)$'
    replace: '#\1'
    backup: true
  notify: Reload systemd

- name: Update existing swap parameter in GRUB
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX="(?:\s*[^\s"]+\s+)*\s*)systemd\.swap=[^\s"]+'
    replace: '\g<1>systemd.swap=0'
    backup: true
  notify:
    - Update grub
    - Reboot node

- name: Add missing swap parameter to GRUB
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX=")(?!(?:systemd\.swap=|[^"]*\s+systemd\.swap=))'
    replace: '\g<1>systemd.swap=0 '
    backup: true
  notify:
    - Update grub
    - Reboot node

- name: Run pending handlers
  ansible.builtin.meta: flush_handlers

- name: Recheck swap status
  ansible.builtin.command: /usr/sbin/swapon --show --noheadings
  register: swap_status_after
  changed_when: false

- name: Read kernel command line
  ansible.builtin.command: cat /proc/cmdline
  register: kernel_cmdline
  changed_when: false

- name: Verify swap is permanently disabled
  ansible.builtin.assert:
    that:
      - swap_status_after.stdout | trim == ''
      - "'systemd.swap=0' in kernel_cmdline.stdout.split()"
    success_msg: "Swap is permanently disabled"
    fail_msg: "Swap is not permanently disabled"
