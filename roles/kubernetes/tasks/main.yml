---
- name: 필요 패키지 설치
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: APT Keyrings 디렉터리 생성
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Kubernetes GPG 파일 다운로드
  ansible.builtin.get_url:
    url: https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: "0644"

- name: APT 저장소 설정 파일 작성
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.sources
    content: |
      Types: deb
      URIs: https://pkgs.k8s.io/core:/stable:/v1.37/deb/
      Suites: /
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/kubernetes.asc
    owner: root
    group: root
    mode: "0644"

- name: Kubernetes 및 관련 패키지 설치
  ansible.builtin.apt:
    name:
      - "kubeadm={{ kubernetes_version }}"
      - "kubelet={{ kubernetes_version }}"
    state: present
    update_cache: true

- name: Control plane에 kubectl 설치
  ansible.builtin.apt:
    name: "kubectl={{ kubernetes_version }}"
    state: present
    update_cache: true
  when: "'control_plane' in group_names"

- name: Kubernetes 및 관련 패키지 버전 고정
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubeadm
    - kubelet

- name: Kubectl 패키지 버전 고정
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubectl
  when: "'control_plane' in group_names"

- name: Kubelet 서비스 활성화 및 등록
  ansible.builtin.systemd_service:
    name: kubelet
    state: started
    enabled: true
