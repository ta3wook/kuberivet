---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Kubernetes repository signing key
  ansible.builtin.get_url:
    url: https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: "0644"

- name: Configure Kubernetes APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.sources
    content: |
      Types: deb
      URIs: https://pkgs.k8s.io/core:/stable:/v1.37/deb/
      Suites: /
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/kubernetes.asc
    owner: root
    group: root
    mode: "0644"

- name: Install kubeadm and kubelet
  ansible.builtin.apt:
    name:
      - "kubeadm={{ kubernetes_version }}-{{ kubernetes_package_revision }}"
      - "kubelet={{ kubernetes_version }}-{{ kubernetes_package_revision }}"
    state: present
    update_cache: true

- name: Install kubectl on control plane
  ansible.builtin.apt:
    name: "kubectl={{ kubernetes_version }}-{{ kubernetes_package_revision }}"
    state: present
    update_cache: true
  when: "'control_plane' in group_names"

- name: Hold kubeadm and kubelet package versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubeadm
    - kubelet

- name: Hold kubectl package version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubectl
  when: "'control_plane' in group_names"

- name: Start and enable kubelet service
  ansible.builtin.systemd_service:
    name: kubelet
    state: started
    enabled: true
